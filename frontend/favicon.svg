<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Cyber Plate -->
  <rect width="64" height="64" rx="14" fill="#09090b" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#18181b" stroke="url(#sfGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Outer Hexagonal Forge Lattice -->
  <path d="M32 10 L50 20 L50 44 L32 54 L14 44 L14 20 Z" 
        stroke="url(#sfGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="rgba(59, 130, 246, 0.08)" />

  <!-- Data Stream Bus Lines -->
  <path d="M32 10 L32 25" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <path d="M50 44 L38 36" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  <path d="M14 44 L26 36" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />

  <!-- Neuro-Symbolic Synaptic Nodes -->
  <circle cx="32" cy="10" r="2.5" fill="#60a5fa" />
  <circle cx="50" cy="20" r="2.5" fill="#a78bfa" />
  <circle cx="50" cy="44" r="2.5" fill="#818cf8" />
  <circle cx="32" cy="54" r="2.5" fill="#38bdf8" />
  <circle cx="14" cy="44" r="2.5" fill="#818cf8" />
  <circle cx="14" cy="20" r="2.5" fill="#a78bfa" />

  <!-- Central Glowing Autonomous Kernel (Diamond Core) -->
  <path d="M32 24 L40 32 L32 40 L24 32 Z" 
        fill="url(#coreGrad)" 
        filter="url(#glow)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
